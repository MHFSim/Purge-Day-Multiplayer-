const PDE_N={suchti:10,speedy:6,dicker:6,nodder:6,boss:1,spucker:6,rammer:5,bomber:6,heiler:5,schatten:5};
const PDE_BASE={spucker:'suchti',rammer:'dicker',bomber:'speedy',heiler:'suchti',schatten:'speedy'};   /* Anzahl Looks je Typ */

const PDE_CACHE={};
function pdERng(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pdEShade(c,f){ /* Farbe aufhellen (f>0) oder abdunkeln (f<0) */
 const m=/^#([0-9a-f]{6})$/i.exec(c); if(!m) return c; const n=parseInt(m[1],16); let r=n>>16,g=n>>8&255,b=n&255;
 if(f>=0){ r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; } else { r*=1+f; g*=1+f; b*=1+f; }
 return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
}

 L.style=pk(k==='dicker'?['bald','short','messy','cap','beanie']:k==='speedy'?['messy','mohawk','short','bandana','cap','hood']:k==='nodder'?['messy','long','beanie','hood','bald','short']:['bald','short','messy','long','mohawk','beanie','cap','hood','bandana','messy','short']);

function pdWeap(g,dt){ const w=g.w, c=g.cd;
 if(w.spritze){ const L=w.spritze; c.S=(c.S||0)-dt; if(c.S<=0){ const t=pdNearest(g,520); if(t){ c.S=Math.max(.28,1.0-.012*L); const n=pdNSpr(L); pdSnd(n>4?'shot3':n>=2?'shot2':'shot'); const a0=Math.atan2(t.y-g.y,t.x-g.x), sp=n>12?.07:n>6?.1:.16;

   for(const e of g.en){ const dx=e.x-g.x, dy=e.y-g.y, d=Math.hypot(dx,dy); if(d>Ln) continue; let da=Math.atan2(dy,dx)-a; da=Math.atan2(Math.sin(da),Math.cos(da)); if(Math.abs(da)<.55){ pdHit(e,9+.3*L,dx,dy,100); pdStun(e,1.2+.01*L); } } } }

    else for(let i=0;i<n;i++){ const a=g.ang+i*6.283/n, px=g.x+Math.cos(a)*R, py=g.y+Math.sin(a)*R; for(const e of g.en){ if((e.x-px)**2+(e.y-py)**2<(PD_EN[e.k].r+14)**2){ pdHit(e,dm,e.x-g.x,e.y-g.y,60); pdStun(e,.5); } } } } }

function pdCutPlan(){
 const g=PD.g, cs=PD.cs, st=PD_HOUSES.station, gr=PD_HOUSES.gruft;
 cs.sx=st.x+st.w/2; cs.sy=st.y+14; cs.mx0=cs.bx+4; cs.my0=cs.by-22;

}

function pdCutPose(){   /* aktuelle Positionen von Körper und Sanitäter */
 const cs=PD.cs, t=cs.t; let bx=cs.bx, by=cs.by, mx, my, mv=false, mface=1, pump=0, ph=t*9;
 if(t<cs.tRun){ const u=pdEase(t/cs.tRun); mx=cs.sx+(cs.mx0-cs.sx)*u; my=cs.sy+(cs.my0-cs.sy)*u; mv=true; mface=cs.mx0>=cs.sx?1:-1; }
 else if(t<cs.tFail){ mx=cs.mx0; my=cs.my0; pump=t<cs.tCpr?(t-cs.tRun):0; mface=1; }
 else { const u=pdEase((t-cs.tFail)/(cs.tCar-cs.tFail)), dxs=Math.sign(cs.gx-cs.bx)||1; bx=cs.bx+(cs.gx-cs.bx)*u; by=cs.by+(cs.gy-cs.by)*u; mx=bx-dxs*48; my=by-4; mv=t<cs.tCar; mface=dxs; }

}
function pdCutUpdate(dt){

 g.x=p.bx; g.y=p.by; g.anim+=dt; g.t+=0;

 if(t>=cs.tCpr&&!cs.failSnd){ cs.failSnd=true; pdSnd('over'); }
 if(t>=cs.tRise&&!cs.wakeSnd){ cs.wakeSnd=true; pdSnd('boss'); }
 if(t>=cs.tEnd) pdEndCut();
}

function pdWStats(k,L,m,fine){
 L=Math.max(1,L); m=m||1; const R=v=>fine?pdF(v,1):String(Math.round(v));
 if(k==='spritze') return [['Spritzen',pdNSpr(L)+' auf einmal'],['Schaden je Spritze',pdF((8+1.0*L)*m,1)],['Schaden pro Salve',pdF(pdNSpr(L)*(8+1.0*L)*m,1)],['Abstand',pdF(Math.max(.28,1-.012*L),3)+' s'],['Durchschlag',L>=5?'bis 3 Gegner':'1 Gegner (ab Stufe 5: 3)']];
 if(k==='defi') return [['Radius',R(95+.8*L)+' px'],['Schaden',pdF(pdDefiDmg(L)*m,1)],['Rückstoß',R(55+.5*L)],['Wartezeit',pdSec(pdCd('defi',L))]];
 if(k==='sirene') return [['Reichweite',R(240+1.2*L)+' px'],['Schaden',pdF((9+.3*L)*m,1)],['Betäubung',pdF(1.2+.01*L,2)+' s'],['Wartezeit',pdSec(pdCd('sirene',L))]];
 const bm=pdBeams(L); return [[bm?'Laserstrahlen':'Lichter',bm?bm:pdNBlau(L)],[bm?'Länge':'Radius',R(bm?pdLaserLen(L):pdBlauR(L))+' px'],['Schaden',pdF(pdBlauDmg(L)*(bm?1.4:1)*m,1)+' / '+pdF(pdBlauTick(L),2)+' s'],['Drehtempo',pdF(2.6+.01*L+.035*pdX5(L),2)]];
}
/* Meilensteine: [Stufe, Kurztext, Langtext] */
function pdMiles(k){

 if(k==='spritze') for(let L=5;L<=PD_MAXLV;L+=5) a.push([L,'×'+pdNSpr(L),pdNSpr(L)+' Spritzen']);
 else if(k==='blau') for(let L=5;L<=PD_MAXLV;L+=5){ const n=pdNBlau(L); a.push([L,pdBeams(L)?'⚡':String(n),n===6?'Neonlaser (2 Strahlen)':n>6?'Neonlaser ('+pdBeams(L)+' Strahlen)':n+' Lichter']); }
 else for(let L=10;L<=PD_MAXLV;L+=10) a.push([L,k==='defi'?Math.round(95+.8*L)+'':Math.round(240+1.2*L)+'',(k==='defi'?'Radius ':'Reichweite ')+Math.round(k==='defi'?95+.8*L:240+1.2*L)+' px']);
 return a;
}

function pdHzTick(dt){

  h.t+=dt;
  if(h.k==='b'){ h.x+=h.vx*dt; h.y+=h.vy*dt; h.life-=dt; if(h.life<=0||h.x<PD_AR.x0-40||h.x>PD_AR.x1+40||h.y<PD_AR.y0-40||h.y>PD_AR.y1+40) h.dead=1;
   if(!h.dead) for(const p of PLs){ const rr=h.r+11; if((p.x-h.x)**2+(p.y-4-h.y)**2<rr*rr){ const res=pdDmgP(p,h.dmg); h.dead=1; if(res===2) return; break; } } }
  else if(h.k==='c'){ if(!h.done&&h.t>=h.w){ h.done=1;
    for(const p of PLs){ if((p.x-h.x)**2+(p.y-h.y)**2<(h.r+10)**2){ if(pdDmgP(p,h.dmg)===2) return; } }
    g.fx.push({k:'boom',x:h.x,y:h.y,t:0,life:.55,R:h.r}); pdSnd(h.sub==='bomb'||h.sub==='c4'?'boom':'hit'); }
   if(h.t>=h.w+h.tail) h.dead=1; }
  else if(h.k==='n'){ if(h.t>=h.w&&h.t<h.w+h.dur){
    if(!h.fired){ h.fired=1; pdSnd('boom'); }
    for(const p of PLs){ const kk=key(p); if(h.hit[kk]) continue; const dx=p.x-h.x, dy=p.y-4-h.y, d=Math.hypot(dx,dy); if(d>h.len+12||d<4) continue;
     let da=Math.atan2(dy,dx)-h.a; da=Math.atan2(Math.sin(da),Math.cos(da)); if(Math.abs(da)<h.arc/2+Math.atan(15/Math.max(d,30))){ h.hit[kk]=1; if(pdDmgP(p,h.dmg)===2) return; } } }
   if(h.t>=h.w+h.dur) h.dead=1; }
  else if(h.k==='z'){ if(h.t>=h.w){ h.tk-=dt; if(h.tk<=0){ h.tk=.5; for(const p of PLs){ if((p.x-h.x)**2+(p.y-h.y)**2<(h.r+8)**2){ if(pdDmgP(p,h.dmg)===2) return; } } } }
   if(h.t>=h.w+h.life) h.dead=1; }
 }
 g.hz=g.hz.filter(h=>!h.dead);
}

function pdBigPick(e,A,ph,sp){

 const pool=e.af?['c4','burp','slam','hail','summon']:ph===1?['c4','burp','slam','hail','summon']:ph===2?['c4','burp','burp2','slam','hail','summon','leap']:['c4','burp2','slam','hail','leap','gas','combo','burp'];
 let a; let n=0; do{ a=pool[Math.floor(Math.random()*pool.length)]; }while(a===A.last&&++n<6);
 A.last=a;
 const rp=()=>{ const L=pdPlayers(g); return L[Math.floor(Math.random()*L.length)]||g; };
 const q=(t,f)=>A.q.push({t:t/sp,f}), T=s=>s/sp;
 const col=Math.floor(Math.random()*PD_HZC.length);
 const burp=(ang,w,arc,dmg,c)=>{ g.hz.push({k:'n',x:e.x,y:e.y-14,a:ang,arc,len:620,t:0,w,dur:.55,dmg,col:c,hit:{}}); };
 switch(a){
  case 'c4': { const cnt=(e.af?2:2)+ph*2; A.pose=3; A.ct=T(cnt*.3+.6);
    for(let i=0;i<cnt;i++) q(i*.3,()=>{ const p=rp(), j=i%2?70:30; pdBlast(p.x+pdRand(-j,j),p.y+pdRand(-j,j)+6,92,T(1.9),38,'c4',0); pdSnd('c4set'); }); break; }
  case 'burp': { const p=rp(); const ang=Math.atan2(p.y-e.y,p.x-e.x), w=T(ph===1?1.4:ph===2?1.2:1.05); A.pose=4; A.ct=w+T(.9);
    pdAnn(g,'RÜLPS!','Geh aus dem Weg!',PD_HZC[col],1.4); burp(ang,w,.6+.08*ph,40,col); pdSnd('boss'); break; }
  case 'burp2': { const p=rp(); const ang=Math.atan2(p.y-e.y,p.x-e.x), w=T(1.3); A.pose=4; A.ct=w+T(.9);
    pdAnn(g,'DOPPEL-RÜLPS!','',PD_HZC[col],1.4); burp(ang-.62,w,.5,40,col); burp(ang+.62,w,.5,40,(col+2)%PD_HZC.length); pdSnd('boss'); break; }
  case 'slam': { A.pose=5; A.ct=T(1.7); const w1=T(1.15), w2=T(1.55);
    pdBlast(e.x,e.y,115,w1,34,'slam',0);
    const n1=6, o1=Math.random()*6.2832; for(let i=0;i<n1;i++){ const an=o1+i*6.2832/n1; pdBlast(e.x+Math.cos(an)*165,e.y+Math.sin(an)*165,72,w1,34,'slam',0); }
    if(ph>=2||e.af){ const n2=9, o2=Math.random()*6.2832; for(let i=0;i<n2;i++){ const an=o2+i*6.2832/n2; pdBlast(e.x+Math.cos(an)*310,e.y+Math.sin(an)*310,80,w2,34,'slam',0); } }
    pdSnd('boss'); break; }
  case 'hail': { const waves=3+ph, N=12+4*ph; A.pose=6; A.ct=T(waves*.42+.5);
    for(let w=0;w<waves;w++) q(w*.42,()=>{ const off=w*(Math.PI/N)+Math.random()*.1; for(let i=0;i<N;i++) pdShoot(e.x,e.y-10,off+i*6.2832/N,165+10*ph,13,(w%2)?3:1,7,3.6); pdSnd('shot3'); }); break; }
  case 'summon': { A.pose=5; A.ct=T(1.2);
    q(.7,()=>{ if(g.en.length>44) return; const kinds=ph>=2?['suchti','speedy','dicker','speedy']:['suchti','speedy']; const cnt=4+ph*2; for(let i=0;i<cnt;i++){ const an=i*6.2832/cnt, k=kinds[i%kinds.length]; const m=pdMkEnemy(k,e.x+Math.cos(an)*90,e.y+Math.sin(an)*90,1+(e.bn%50)*.1+g.t/900); g.fx.push({k:'puff',x:m.x,y:m.y,t:0,life:.5}); } pdSnd('boss'); }); break; }
  case 'leap': { const p=rp(); A.pose=1; A.ct=T(1.5); pdBlast(p.x,p.y+4,128,T(1.05),42,'slam',1);
    const tx=p.x, ty=p.y; q(1.05,()=>{ g.fx.push({k:'puff',x:e.x,y:e.y,t:0,life:.5}); e.x=Math.max(PD_AR.x0+50,Math.min(PD_AR.x1-50,tx)); e.y=Math.max(PD_AR.y0+60,Math.min(PD_AR.y1-50,ty)); g.fx.push({k:'puff',x:e.x,y:e.y,t:0,life:.5}); pdSnd('boss'); }); break; }
  case 'gas': { A.pose=5; A.ct=T(1.1); const L=pdPlayers(g).slice(); L.push(rp());
    for(const p of L){ if(g.hz.length>120) break; g.hz.push({k:'z',x:p.x,y:p.y+4,r:88,t:0,w:T(.95),life:7,tk:0,dmg:7,col:1}); } pdSnd('boss'); break; }
  case 'combo': { const p=rp(); const ang=Math.atan2(p.y-e.y,p.x-e.x), w=T(1.15); A.pose=4; A.ct=w+T(1.5); pdAnn(g,'RÜLPS & HAGEL!','',PD_HZC[col],1.4);
    burp(ang,w,.75,40,col); q(.5,()=>{ for(let i=0;i<20;i++) pdShoot(e.x,e.y-10,i*6.2832/20,175,13,3,7,3.4); }); q(1.3,()=>{ for(let i=0;i<20;i++) pdShoot(e.x,e.y-10,.15+i*6.2832/20,175,13,1,7,3.4); }); pdSnd('boss'); break; }
 }
 A.c=T(ph===1?2.4:ph===2?1.8:1.3)+A.ct;
}

/* ---------- Tür und Arena im Jedmayer ---------- */
const PD_DOORP={x:1050,y:303};
function pdDoorCheck(g){
 if(!g.door||g.arena||g.bigOn) return;
 for(const p of pdPlayers(g)) if(Math.hypot(p.x-PD_DOORP.x,p.y-PD_DOORP.y)<44){ pdArenaEnter(g); return; }
}
function pdArenaEnter(g){
 g.stash={en:g.en.filter(e=>e.hp>0)}; g.en=[]; g.pr=[]; g.hz=[]; g.c4s=[]; g.kfl=[]; g.gem=g.gem.filter(q=>q.y>PD_FA.y0); g.bp=null;
 g.door=false; const av=Math.max(0,(g.bigN|0)-1)%PD_AV.length; g.arena={r:0,total:20,s:'intro',t:3.4,q:[],sp:0,alive:0,exit:null,v:av}; PD.bgA=pdArenaBg(av); g.arenaSeq=(g.arenaSeq|0)+1;
 Object.assign(PD_AR,PD_ARENA);
 const ax=(PD_ARENA.x0+PD_ARENA.x1)/2, ay=PD_ARENA.y1-40, PL=pdAll(g).filter(o=>!o.off);
 PL.forEach((o,i)=>{ o.x=ax+(i-(PL.length-1)/2)*70; o.y=ay; o.vx=o.vy=0; });
 g.inv=3; for(const p of g.ps||[]) p.hurt=Math.max(p.hurt||0,2);
 pdAnn(g,PD_AV[av].t1,PD_AV[av].t2,'#ffd23f',3.4); pdSnd('boss');
}
function pdArenaWave(r){
 const L=[], pool=r<=3?['rammer','speedy']:r<=7?['rammer','heiler','schatten','speedy']:['rammer','heiler','schatten','dicker','speedy'];
 const n=Math.min(34,Math.round(4+r*1.6)), modsA=r<4?[]:r<9?[1,2]:r<14?[1,2,3]:[1,2,3], pm=Math.min(.55,.06+r*.03);
 for(let i=0;i<n;i++){ const k=pool[Math.floor(Math.random()*pool.length)]; L.push({k,mod:(modsA.length&&Math.random()<pm)?modsA[Math.floor(Math.random()*modsA.length)]:0}); }
 if(r===5){ L.push({k:'dicker',mod:1,el:1},{k:'rammer',mod:3,el:1}); }
 if(r===10){ L.push({k:'dicker',mod:1,el:1},{k:'rammer',mod:3,el:1},{k:'schatten',mod:3,el:1}); }
 if(r===15){ L.push({k:'dicker',mod:1,el:1},{k:'dicker',mod:3,el:1},{k:'rammer',mod:2,el:1},{k:'schatten',mod:3,el:1}); }
 if(r===20){ L.length=Math.min(L.length,8); L.push({k:'big',fin:1}); }
 for(let i=L.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [L[i],L[j]]=[L[j],L[i]]; }
 return L;
}
function pdArenaTick(dt){
 const g=PD.g, A=g.arena; if(!A) return;
 const PLs=pdPlayers(g);
 if(A.s==='intro'){ A.t-=dt; if(A.t<=0) pdArenaRound(g,1); }
 else if(A.s==='wave'){
  A.sp-=dt;
  if(A.q.length&&A.sp<=0){ A.sp=.38; const cnt=Math.min(A.q.length,A.r>=10?3:2);
   for(let i=0;i<cnt;i++){ const it=A.q.shift(), PT=pdAPort(g), pt=PT[Math.floor(Math.random()*PT.length)];
    if(it.k==='big'){ pdBigSpawn(g,true); const be=g.en[g.en.length-1]; be.x=(PD_ARENA.x0+PD_ARENA.x1)/2; be.y=PD_ARENA.y0+130; continue; }
    const hm=1.5+.17*A.r+g.t/1200; if(((it.k==='schatten'||it.k==='spucker'||it.k==='rammer')&&pdKindN(it.k)>=2)||(it.k==='heiler'&&pdKindN('heiler')>=3)) it.k=pdKindN('dicker')<6?'dicker':'speedy'; const m=pdMkEnemy(it.k,pt[0]+pdRand(-18,18),pt[1]+pdRand(-18,18),hm,it.mod,it.el); g.fx.push({k:'puff',x:m.x,y:m.y,t:0,life:.45}); } }
  A.alive=g.en.reduce((n,e)=>n+(e.hp>0?1:0),0);
  if(!A.q.length&&A.alive===0){ if(A.r>=A.total){ A.s='done'; A.t=1.5; } else { A.s='break'; A.t=4.2; pdAnn(g,'RUNDE '+A.r+' GESCHAFFT','Kurz durchatmen …','#7dff9a',2.6);
    if(!g.bp) g.bp={x:(PD_ARENA.x0+PD_ARENA.x1)/2,y:(PD_ARENA.y0+PD_ARENA.y1)/2+10}; for(const o of pdAll(g)) if(!o.dead&&!o.off) o.hp=Math.min(o.hpMax,o.hp+Math.round(o.hpMax*.12)); } } }
 else if(A.s==='break'){ A.t-=dt; if(A.t<=0) pdArenaRound(g,A.r+1); }
 else if(A.s==='done'){ A.t-=dt; if(A.t<=0){ A.s='exit'; A.exit={x:(PD_ARENA.x0+PD_ARENA.x1)/2,y:PD_ARENA.y1-26};
   for(const o of pdAll(g)){ o.xp+=Math.round(o.xpN*2.2); o.coins=(o.coins|0)+8; if(!o.dead&&!o.off) o.hp=o.hpMax; if(o.dead){ o.dead=0; o.hp=o.hpMax; o.koT=0; o.rT=0; o.rv=0; o.rvP=0; } }
   pdAnn(g,'GESCHAFFT!','20 Runden überlebt · Belohnung eingesackt · Ausgang unten','#ffd23f',4.5); pdSnd('maut'); } }
 else if(A.s==='exit'){ for(const p of PLs) if(Math.hypot(p.x-A.exit.x,p.y-A.exit.y)<46){ pdArenaLeave(g); return; } }
}
function pdArenaRound(g,r){
 const A=g.arena; A.r=r; A.s='wave'; A.q=pdArenaWave(r); A.sp=.5;
 const boss=r%5===0; pdAnn(g,'RUNDE '+r+' / '+A.total,boss?(r===20?'FINALE: Der Filialleiter':'ELITE-RUNDE'):'Mach dich bereit …',boss?'#ff6b6b':'#ffd23f',2.6); pdSnd(boss?'boss':'go');
}
function pdArenaLeave(g){
 const A=g.arena; if(!A) return;
 Object.assign(PD_AR,PD_FA);
 const st=g.stash&&g.stash.en||[]; g.en=st.filter(e=>(e.x-PD_DOORP.x)**2+(e.y-PD_DOORP.y)**2>300*300); g.stash=null; g.arena=null; g.hz=[]; g.pr=[]; g.c4s=[];
 const PL=pdAll(g).filter(o=>!o.off);
 PL.forEach((o,i)=>{ o.x=PD_DOORP.x+(i-(PL.length-1)/2)*60; o.y=PD_DOORP.y+80; o.vx=o.vy=0; });
 g.inv=3.5; for(const p of g.ps||[]) p.hurt=Math.max(p.hurt||0,2);

 pdAnn(g,'ZURÜCK AUF DEM FELD','Der Purge-Day geht weiter …','#ffe14d',3); pdSnd('go');
}
function pdArenaCancel(g){

 g.en=(g.stash&&g.stash.en)||[]; g.stash=null; g.arena=null; g.hz=[]; g.door=true;
 g.x=PD_DOORP.x; g.y=PD_DOORP.y+80; for(const p of g.ps||[]){ p.x=g.x+40; p.y=g.y; }

    x.globalAlpha=.8*k; x.fillStyle='#fff'; for(let i=0;i<14;i++){ const rr=60+((i*97+h.t*900)%(h.len-70)), aa=h.a+Math.sin(i*5.1+h.t*30)*h.arc*.4; x.beginPath(); x.arc(h.x+Math.cos(aa)*rr,h.y+Math.sin(aa)*rr,3+(i%4)*2.2,0,7); x.fill(); } }

const PD_KO_T=120, PD_RV_T=2, PD_RV_R=62;

/* ---------- Statistik je Spieler ---------- */
function pdSt(o){ return o.st||(o.st={k:0,d:0,tk:0,ko:0,rv:0,bk:0}); }
function pdStatRows(g){ return pdAll(g).filter(o=>!o.gone).map(o=>{ const S=pdSt(o); return [o===g?0:o.slot,o.n,o.lv|0,S.k|0,Math.round(S.d),Math.round(S.tk),S.ko|0,S.rv|0,S.bk|0]; }); }
function pdNum(v){ v=Math.round(v); return v>=1e6?(v/1e6).toFixed(v>=1e7?0:1).replace('.',',')+' Mio':v>=1e4?Math.round(v/1000)+' Tsd':v.toLocaleString('de-AT'); }
function pdStatHTML(rows){
 if(!rows||!rows.length) return '';
 const best=i=>Math.max(...rows.map(r=>r[i]));
 const bk=best(3), bd=best(4), brv=best(7), multi=rows.length>1;
 const cards=rows.map(r=>{ const col=PD_PCOL[(r[0]|0)%6];
  const cell=(v,l,top)=>`<span class="${multi&&top?'top':''}"><b>${v}</b><small>${l}</small></span>`;
  return `<div class="pdsx" style="--pc:${col}"><div class="pdsxh"><i>${r[0]===0?'👑':'P'+(r[0]+1)}</i><b>${esc(r[1])}</b><em>Stufe ${r[2]}</em>${multi&&r[3]===bk&&bk>0?'<u>MVP</u>':''}</div><div class="pdsxg">${cell(pdNum(r[3]),'besiegt',r[3]===bk&&bk>0)}${cell(pdNum(r[4]),'Schaden',r[4]===bd&&bd>0)}${cell(pdNum(r[5]),'eingesteckt',false)}${cell(r[6],'K.O.',false)}${cell(r[7],'gerettet',r[7]===brv&&brv>0)}${cell(r[8],'Bosse',false)}</div></div>`; }).join('');
 return `<div class="pdsxl">${cards}</div>`;
}

/* ---------- K.O. und Rettung (Mehrspieler) ---------- */
function pdKO(o){
 const g=PD.g; if(o.dead) return; o.hp=0; o.dead=1; o.koT=PD_KO_T; o.rT=PD_KO_T; o.rv=0; o.rvP=0; pdSt(o).ko++;
 o.akOn=false; o.glOn=false;
 pdTxt(o.x,o.y-50,'✚ '+o.n+' ist K.O.!','#ff5d5d',2.4); pdSnd('hurt');
 pdAnn(g,o.n.toUpperCase()+' IST K.O.!','2 s bei '+o.n+' bleiben = gerettet','#ff5d5d',3.2);
}
function pdGameOver(g,why){ if(g.over) return; g.why=why; g.over=true; pdEnd(); }
function pdKOTick(g,dt){
 if(!g.mp||g.over) return;
 const alive=pdPlayers(g);
 for(const o of pdAll(g)){ if(!o.dead||o.off) continue;
  o.koT=(o.koT==null?PD_KO_T:o.koT)-dt; o.rT=Math.max(0,o.koT);
  const H=alive.filter(p=>Math.hypot(p.x-o.x,p.y-o.y)<PD_RV_R);
  if(H.length) o.rv=(o.rv||0)+dt*(H.length>1?1.3:1); else o.rv=Math.max(0,(o.rv||0)-dt*.6);
  o.rvP=Math.round(Math.min(1,o.rv/PD_RV_T)*100);
  if(o.rv>=PD_RV_T){ o.dead=0; o.hp=Math.ceil(o.hpMax*.7); o.rv=0; o.rvP=0; o.koT=0; o.rT=0;
   if(o===g){ g.inv=2.5; g.hurt=0; } else o.hurt=2.5;
   for(const h of H) pdSt(h).rv++;
   pdTxt(o.x,o.y-54,'✚ '+o.n+' ist gerettet!','#7dff9a',2.4); g.fx.push({k:'heal',x:o.x,y:o.y,t:0,life:.8,R:90}); pdSnd('heal'); continue; }
  if(o.koT<=0){ pdGameOver(g,o.n+' wurde nicht rechtzeitig gerettet.'); return; }
 }
 if(!alive.length&&pdAll(g).some(o=>o.dead&&!o.off)) pdGameOver(g,'Alle sind K.O. – niemand konnte mehr helfen.');
}

/* ---------- Pfützen: bremsen Spieler und Gegner ---------- */
function pdPudMake(A,obs,seed,n,avoid){
 const R=pdERng(seed), L=[]; let tries=0;
 while(L.length<n&&tries++<800){
  const rx=32+R()*20, ry=17+R()*9, x=A.x0+130+R()*(A.x1-A.x0-260), y=A.y0+130+R()*(A.y1-A.y0-260);
  if(obs.some(b=>b.r?Math.hypot(b.x-x,b.y-y)<b.r+rx+34:(x+rx+34>b.x0&&x-rx-34<b.x1&&y+ry+34>b.y0&&y-ry-34<b.y1))) continue;
  if(L.some(q=>Math.hypot(q.x-x,q.y-y)<320)) continue;
  if(avoid&&avoid.some(([px,py])=>Math.hypot(px-x,py-y)<120)) continue;
  const bl=[[0,0,rx,ry]]; for(let i=0;i<3;i++) bl.push([(R()-.5)*rx*1.2,(R()-.5)*ry*.9,rx*(.42+R()*.3),ry*(.55+R()*.3)]);
  L.push({x,y,rx:rx*1.7,ry:ry*1.7,bl,ph:R()*6});
 }
 return L;
}
function pdPudList(){ const g=PD.g; return (g&&g.arena)?(PD_PUD_AV[g.arena.v|0]||PD_PUD_AV[0]):PD_PUD_F; }
function pdInPud(px,py){
 const L=pdPudList();
 for(let i=0;i<L.length;i++){ const q=L[i]; if(Math.abs(px-q.x)>q.rx||Math.abs(py-q.y)>q.ry) continue;
  for(const b of q.bl){ const u=(px-q.x-b[0])/b[2], v=(py-q.y-b[1])/b[3]; if(u*u+v*v<1) return true; } }
 return false;
}

 for(const q of L){
  
  for(const b of q.bl){ const gr=x.createRadialGradient(q.x+b[0]-b[2]*.3,q.y+b[1]-b[3]*.4,2,q.x+b[0],q.y+b[1],b[2]); gr.addColorStop(0,'rgba(130,165,200,.62)'); gr.addColorStop(.6,'rgba(48,72,100,.7)'); gr.addColorStop(1,'rgba(28,42,60,.66)'); x.fillStyle=gr; x.beginPath(); x.ellipse(q.x+b[0],q.y+b[1],b[2],b[3],0,0,7); x.fill(); }
