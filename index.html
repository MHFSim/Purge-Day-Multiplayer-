const PDE_N={suchti:10,speedy:6,dicker:6,nodder:6,boss:1,spucker:6,rammer:5,bomber:6,heiler:5,schatten:5};
const PDE_BASE={spucker:'suchti',rammer:'dicker',bomber:'speedy',heiler:'suchti',schatten:'speedy'};   /* Anzahl Looks je Typ */

const PDE_CACHE={};
function pdERng(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pdEShade(c,f){ /* Farbe aufhellen (f>0) oder abdunkeln (f<0) */
 const m=/^#([0-9a-f]{6})$/i.exec(c); if(!m) return c; const n=parseInt(m[1],16); let r=n>>16,g=n>>8&255,b=n&255;
 if(f>=0){ r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; } else { r*=1+f; g*=1+f; b*=1+f; }
 return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
}

 L.style=pk(k==='dicker'?['bald','short','messy','cap','beanie']:k==='speedy'?['messy','mohawk','short','bandana','cap','hood']:k==='nodder'?['messy','long','beanie','hood','bald','short']:['bald','short','messy','long','mohawk','beanie','cap','hood','bandana','messy','short']);
 L.top=pk(k==='dicker'?['tank','tee','hoodie','flannel']:k==='speedy'?['track','tank','tee','hoodie']:['hoodie','tee','track','puffer','tank','flannel','hoodie','tee']);

function pdFkTargets(g,L){
 const R=pdFkR(L), n=pdFkN(L), pool=[];

 if(!pool.length) return [];

 return d.d;

/* ---------- Skill-Tree: Übersicht aller Waffen und Ausrüstung ---------- */
function pdF(v,d){ return (Math.round(v*Math.pow(10,d||0))/Math.pow(10,d||0)).toString().replace('.',','); }
/* Werte einer Waffe bei Stufe L: [Name, Text] */
function pdWStats(k,L,m,fine){
 L=Math.max(1,L); m=m||1; const R=v=>fine?pdF(v,1):String(Math.round(v));
 if(k==='spritze') return [['Spritzen',pdNSpr(L)+' auf einmal'],['Schaden je Spritze',pdF((7+.8*L)*m,1)],['Schaden pro Salve',pdF(pdNSpr(L)*(7+.8*L)*m,1)],['Abstand',pdF(Math.max(.32,1-.011*L),3)+' s'],['Durchschlag','Gegner dahinter bei Tod: −50 %']];
 if(k==='defi') return [['Radius',R(95+.8*L)+' px'],['Schaden',pdF(pdDefiDmg(L)*m,1)],['Wartezeit',pdSec(pdCd('defi',L))]];
 if(k==='sirene') return [['Reichweite',R(240+1.2*L)+' px'],['Schaden',pdF((9+.3*L)*m,1)],['Betäubung',pdF(1.2+.01*L,2)+' s'],['Wartezeit',pdSec(pdCd('sirene',L))]];
 if(k==='fackel') return [['Fackeln',pdFkN(L)+' pro Wurf'],['Radius',R(pdFkR(L))+' px'],['Schaden',pdF(pdFkDmg(L)*m,1)+' alle 0,5 s'],['Brenndauer',pdF(pdFkLife(L),1)+' s'],['Wartezeit',pdSec(pdFkCd(L))]];
 const bm=pdBeams(L); return [[bm?'Laserstrahlen':'Lichter',bm?bm:pdNBlau(L)],[bm?'Länge':'Radius',R(bm?pdLaserLen(L):pdBlauR(L))+' px'],['Schaden',pdF(pdBlauDmg(L)*(bm?1.4:1)*m,1)+' / '+pdF(pdBlauTick(L),2)+' s'],['Drehtempo',pdF(2.6+.01*L+.035*pdX5(L),2)]];
}
/* Meilensteine: [Stufe, Kurztext, Langtext] */
function pdMiles(k){
 const a=[];
 if(k==='spritze') for(let L=5;L<=PD_MAXLV;L+=5) a.push([L,'×'+pdNSpr(L),pdNSpr(L)+' Spritzen']);
 else if(k==='blau') for(let L=5;L<=PD_MAXLV;L+=5){ const n=pdNBlau(L); a.push([L,pdBeams(L)?'⚡':String(n),n===6?'Neonlaser (2 Strahlen)':n>6?'Neonlaser ('+pdBeams(L)+' Strahlen)':n+' Lichter']); }
 else if(k==='fackel') for(let L=10;L<=PD_MAXLV;L+=10) a.push([L,'×'+pdFkN(L),pdFkN(L)+' Fackeln']);
 else for(let L=10;L<=PD_MAXLV;L+=10) a.push([L,k==='defi'?Math.round(95+.8*L)+'':Math.round(240+1.2*L)+'',(k==='defi'?'Radius ':'Reichweite ')+Math.round(k==='defi'?95+.8*L:240+1.2*L)+' px']);
 return a;
}

function netJoinGo(){

function netFail(msg){ const lc=NET.lastCode; netStop(); NET.err=msg; NET.lastCode=lc; pdSnd('bad'); if(WZ.on) netJoinScreen(true); }
async function netJoin(code){
 netStop(); NET.err=''; NET.st='Lade …'; NET.lastCode=code; netJoinScreen(true);

 try{ await netLib(); }catch(e){ if(gen!==NET.gen) return; NET.st=''; NET.err='Die Netzwerk-Bibliothek konnte nicht geladen werden. Für Mehrspieler braucht ihr Internet.'; netJoinScreen(true); return; }
 if(gen!==NET.gen||PD.st!=='joinui') return;
 NET.on=true; NET.host=false; NET.code=code; NET.st='Verbinde mit Raum '+code+' …'; netJoinScreen(true);
 NET.iv=setInterval(netGuestTick,500);
 NET.to=setTimeout(()=>{ if(gen===NET.gen&&PD.st==='joinui') netFail('Keine Antwort von Raum '+code+'. Stimmt der Code?'); },15000);
 netConnect(gen);

  c.on('open',()=>{ if(gen!==NET.gen) return; try{ c.send({t:'hi',uid:NET.uid}); }catch(e){}
   try{ const sc=p.connect(NET_PFX+NET.code.toLowerCase(),{reliable:false,serialization:'raw',metadata:{st:1,uid:NET.uid}}); NET.sconn=sc;
    sc.on('data',d=>{ if(gen!==NET.gen) return; NET.lastRx=Date.now(); DG.rx+=(d&&(d.byteLength||d.size))||0; DG.pk++; netToBuf(d).then(ab=>{ if(gen!==NET.gen||!ab) return; let o=null; try{ o=netDecode(ab); }catch(e){} if(o) netGuestSnap(o); }); });
    sc.on('error',()=>{}); sc.on('close',()=>{}); }catch(e){} });

  c.on('error',()=>{});
 });
 p.on('disconnected',()=>{ if(gen!==NET.gen||!NET.welcomed) return; setTimeout(()=>{ try{ if(gen===NET.gen&&!p.destroyed) p.reconnect(); }catch(e){} },1500); });
 p.on('error',err=>{ if(gen!==NET.gen) return; const t=err&&err.type;
  if(NET.re){ clearTimeout(NET.to); NET.to=setTimeout(()=>{ if(gen===NET.gen&&NET.re) netReconnect(); },2500); return; }
  if(!NET.welcomed){ netFail(t==='peer-unavailable'?'Raum '+NET.code+' wurde nicht gefunden.':'Verbindungsfehler ('+(t||'?')+').'); return; }
  /* andere Fehler nach dem Verbinden: Datenverbindung läuft meist weiter, die Zeitüberwachung entscheidet */
 });
}

function pdBlast(x,y,r,w,dmg,sub,col){ const g=PD.g; if(g.hz.length>130) return null; const h={k:'c',x,y,r,w,tail:.06,dmg,sub:sub||'',col:col===undefined?0:col,t:0}; g.hz.push(h); return h; }

function pdAbility(e,d,dt,tp,dist,dx,dy,vx,vy,PLs){

   break;

  default: { const r=pdAbility2(e,d,dt,tp,dist,dx,dy,vx,vy,ux,uy,A); if(r){ vx=r[0]; vy=r[1]; } }
 }

}

function pdHzTick(dt){
 const g=PD.g; if(!g.hz||!g.hz.length) return;
 const PLs=pdPlayers(g); const key=p=>p===g?0:(p.slot|0);
 for(const h of g.hz){
  h.t+=dt;
  if(h.k==='b'){ h.x+=h.vx*dt; h.y+=h.vy*dt; h.life-=dt; if(h.life<=0||h.x<PD_AR.x0-40||h.x>PD_AR.x1+40||h.y<PD_AR.y0-40||h.y>PD_AR.y1+40) h.dead=1;
   if(!h.dead) for(const p of PLs){ const rr=h.r+11; if((p.x-h.x)**2+(p.y-4-h.y)**2<rr*rr){ const res=pdDmgP(p,h.dmg); h.dead=1; if(res===2) return; break; } } }
  else if(h.k==='c'){ if(!h.done&&h.t>=h.w){ h.done=1;
    for(const p of PLs){ if((p.x-h.x)**2+(p.y-h.y)**2<(h.r+10)**2){ if(pdDmgP(p,h.dmg)===2) return; } }
    g.fx.push({k:'boom',x:h.x,y:h.y,t:0,life:.55,R:h.r}); pdSnd(h.sub==='bomb'||h.sub==='c4'?'boom':'hit'); }
   if(h.t>=h.w+h.tail) h.dead=1; }
  else if(h.k==='n'){ if(h.t>=h.w&&h.t<h.w+h.dur){
    if(!h.fired){ h.fired=1; pdSnd('boom'); }
    for(const p of PLs){ const kk=key(p); if(h.hit[kk]) continue; const dx=p.x-h.x, dy=p.y-4-h.y, d=Math.hypot(dx,dy); if(d>h.len+12||d<4) continue;
     let da=Math.atan2(dy,dx)-h.a; da=Math.atan2(Math.sin(da),Math.cos(da)); if(Math.abs(da)<h.arc/2+Math.atan(15/Math.max(d,30))){ h.hit[kk]=1; if(pdDmgP(p,h.dmg)===2) return; } } }
   if(h.t>=h.w+h.dur) h.dead=1; }
  else if(h.k==='z'){ if(h.t>=h.w){ h.tk-=dt; if(h.tk<=0){ h.tk=.5; for(const p of PLs){ if((p.x-h.x)**2+(p.y-h.y)**2<(h.r+8)**2){ if(pdDmgP(p,h.dmg)===2) return; } } } }
   if(h.t>=h.w+h.life) h.dead=1; }
 }
 g.hz=g.hz.filter(h=>!h.dead);
}
function pdHzPack(h){

 if(h.k==='c') return ['c',Math.round(h.x),Math.round(h.y),h.r,Math.round(h.t*100)/100,h.w,h.col,h.sub==='c4'?1:0];

 if(k==='b') return {k,x:a[1],y:a[2],vx:a[3],vy:a[4],r:a[5],col:a[6],t:0};

function pdBigAI(e,d,dt,tp,dist,dx,dy,PLs){

 if(!A.q) A.q=[];
 const f=e.hp/e.hpMax, ph=f>.66?1:f>.33?2:3, sp=1+.07*Math.min(10,(e.bn%50)|0);
 if(ph!==A.ph){ A.ph=ph; A.c=Math.min(A.c,.8); pdAnn(g,'PHASE '+ph,ph===3?'RASEREI!':'Er wird wütend!','#ff6b6b',2.6); pdSnd('boss'); e.flash=.5; g.fx.push({k:'boom',x:e.x,y:e.y,t:0,life:.6,R:170}); }
 e.st=0;
 for(const a of A.q){ a.t-=dt; if(a.t<=0&&!a.done){ a.done=1; try{ a.f(); }catch(er){} } }
 A.q=A.q.filter(a=>!a.done);
 if(A.ct>0){ A.ct-=dt; e.st=A.pose||0; return [0,0]; }
 A.c-=dt;
 if(A.c<=0&&PLs.length){ pdBigPick(e,A,ph,sp); return [0,0]; }

function pdBigPick(e,A,ph,sp){

function pdSt(o){ return o.st||(o.st={k:0,d:0,tk:0,ko:0,rv:0,bk:0}); }
function pdStatRows(g){ return pdAll(g).filter(o=>!o.gone).map(o=>{ const S=pdSt(o); return [o===g?0:o.slot,o.n,o.lv|0,S.k|0,Math.round(S.d),Math.round(S.tk),S.ko|0,S.rv|0,S.bk|0]; }); }
function pdNum(v){ v=Math.round(v); return v>=1e6?(v/1e6).toFixed(v>=1e7?0:1).replace('.',',')+' Mio':v>=1e4?Math.round(v/1000)+' Tsd':v.toLocaleString('de-AT'); }
function pdStatHTML(rows){
 if(!rows||!rows.length) return '';
 const best=i=>Math.max(...rows.map(r=>r[i]));
 const bk=best(3), bd=best(4), brv=best(7), multi=rows.length>1;
 const cards=rows.map(r=>{ const col=PD_PCOL[(r[0]|0)%6];
  const cell=(v,l,top)=>`<span class="${multi&&top?'top':''}"><b>${v}</b><small>${l}</small></span>`;
  return `<div class="pdsx" style="--pc:${col}"><div class="pdsxh"><i>${r[0]===0?'👑':'P'+(r[0]+1)}</i><b>${esc(r[1])}</b><em>Stufe ${r[2]}</em>${multi&&r[3]===bk&&bk>0?'<u>MVP</u>':''}</div><div class="pdsxg">${cell(pdNum(r[3]),'besiegt',r[3]===bk&&bk>0)}${cell(pdNum(r[4]),'Schaden',r[4]===bd&&bd>0)}${cell(pdNum(r[5]),'eingesteckt',false)}${cell(r[6],'K.O.',false)}${cell(r[7],'gerettet',r[7]===brv&&brv>0)}${cell(r[8],'Bosse',false)}</div></div>`; }).join('');

function pdKOTick(g,dt){

  o.koT=(o.koT==null?PD_KO_T:o.koT)-dt; o.rT=Math.max(0,o.koT);
  const H=alive.filter(p=>Math.hypot(p.x-o.x,p.y-o.y)<PD_RV_R);

   if(o===g){ g.inv=2.5; g.hurt=0; } else o.hurt=2.5;
   for(const h of H) pdSt(h).rv++;

  if(o.koT<=0){ pdGameOver(g,o.n+' wurde nicht rechtzeitig gerettet.'); return; }

}

/* ---------- Pfützen: bremsen Spieler und Gegner ---------- */
function pdPudMake(A,obs,seed,n,avoid){
 const R=pdERng(seed), L=[]; let tries=0;
 while(L.length<n&&tries++<800){
  const rx=32+R()*20, ry=17+R()*9, x=A.x0+130+R()*(A.x1-A.x0-260), y=A.y0+130+R()*(A.y1-A.y0-260);
  if(obs.some(b=>b.r?Math.hypot(b.x-x,b.y-y)<b.r+rx+34:(x+rx+34>b.x0&&x-rx-34<b.x1&&y+ry+34>b.y0&&y-ry-34<b.y1))) continue;
  if(L.some(q=>Math.hypot(q.x-x,q.y-y)<320)) continue;
  if(avoid&&avoid.some(([px,py])=>Math.hypot(px-x,py-y)<120)) continue;
  const bl=[[0,0,rx,ry]]; for(let i=0;i<3;i++) bl.push([(R()-.5)*rx*1.2,(R()-.5)*ry*.9,rx*(.42+R()*.3),ry*(.55+R()*.3)]);
  L.push({x,y,rx:rx*1.7,ry:ry*1.7,bl,ph:R()*6});
 }
 return L;
}

}
function netRoundsWrite(r){
 for(let k=0;k<8;k++){ try{ localStorage.setItem(PD_MPKEY2,JSON.stringify({v:2,r})); return true; }catch(e){ if(r.length<=1) return false; r=r.slice().sort((a,b)=>b.ts-a.ts); r.pop(); } }
 return false;
}
/* die laufende Runde in ihren eigenen Platz schreiben (neu anlegen, wenn es ihn noch nicht gibt) */
function netAutoSave(){
 const g=PD.g; if(!g||!g.mp||g.over||!NET.host) return false; if(!NET.rid) NET.rid=pdNewId();
 let rec; try{ rec=netPack(); }catch(e){ return false; } rec.id=NET.rid;
 let r=netRounds().filter(q=>q.id!==NET.rid); r.unshift(rec); r.sort((a,b)=>b.ts-a.ts); if(r.length>PD_MPMAX) r=r.slice(0,PD_MPMAX);
 return netRoundsWrite(r);
}
(function(){ try{ if(localStorage.getItem('mhsim_purgeday_mig12')) return; localStorage.setItem('mhsim_purgeday_mig12','1'); if(!localStorage.getItem(PD_KEY)){ const a=JSON.parse(localStorage.getItem(PD_SLOTKEY)||'[]').filter(x=>x&&x.g&&!x.g.over&&SMAP[x.g.n]); if(a.length){ a.sort((x,y)=>y.ts-x.ts); localStorage.setItem(PD_KEY,JSON.stringify({v:1,ts:a[0].ts,g:a[0].g})); } } }catch(e){} })();
function netRoundDel(id){ netRoundsWrite(netRounds().filter(q=>q.id!==id)); }
function pdSlotRow(r,opts){
 const solo=opts.solo, nm=solo?esc(r.g.n):esc((r.names||[]).join(', '));
 const cur=!solo&&NET.rid&&r.id===NET.rid&&PD.g&&PD.g.mp;
 return `<div class="pdslot${solo?' solo':''}${cur?' cur':''}"><div class="pdsi"><b>${solo?'⭐ Alleine':'👥 Runde'}${cur?' · läuft gerade':''}</b><span>Stufe ${r.lv!=null?r.lv:r.g.lv} · ${pdFmt(r.t!=null?r.t:r.g.t)} · 💤 ${r.g.kills|0}</span><small>${pdDateStr(r.ts)} · ${nm}</small></div><div class="pdsb">${opts.btns||''}</div></div>`;
}
/* Spielstände-Liste (Hauptmenü, Solo-Pause, Lobby, Mehrspieler-Pause) */
function pdSaveList(from,note){
 const ov=wzEnsure(); const old=document.getElementById('pdSlots'); if(old) old.remove();
 const solo=pdLoadSave(), rounds=netRounds(), inMP=from==='mppause'||from==='lobby';
 let html='';
 if(!inMP){
  html+=solo?pdSlotRow(solo,{solo:1,btns:from==='menu'?`<button class="go" data-sv="solo">Laden</button>`:`<button data-sv="solosave">Jetzt speichern</button>`})
   :`<div class="pdslot solo empty"><div class="pdsi"><b>⭐ Alleine</b><small>Noch kein Spiel · wird bei jedem neuen Solo-Spiel automatisch überschrieben</small></div></div>`;
 }
 if(from!=='pause'){
  html+=rounds.length?rounds.map(r=>pdSlotRow(r,{btns:
    (from==='menu'?`<button class="go" data-sv="host" data-id="${r.id}">Raum öffnen</button>`:from==='lobby'?`<button class="go" data-sv="load" data-id="${r.id}">Laden</button>`:(NET.rid===r.id?`<button data-sv="mpsave">Jetzt speichern</button>`:''))
    +(NET.rid===r.id&&PD.g&&PD.g.mp?'':`<button class="x" data-sv="del" data-id="${r.id}" aria-label="Löschen">✕</button>`)})).join('')
   :`<div class="pdslot empty"><div class="pdsi"><b>👥 Mehrspieler-Runden</b><small>Noch keine · jede neue Runde bekommt automatisch einen eigenen Spielstand</small></div></div>`;
 }
 const sub=from==='menu'?`Solo-Spiel (gelb) und bis zu ${PD_MPMAX} Mehrspieler-Runden. Alles wird automatisch gespeichert.`
  :from==='pause'?'Dein Solo-Spiel wird laufend automatisch gespeichert. Ein neues Solo-Spiel überschreibt es.'
  :from==='lobby'?'Eine gespeicherte Runde auswählen – sie startet mit „Spiel starten“. Jeder bekommt seine Figur samt Waffen zurück.'
  :`Diese Runde wird alle 20 s automatisch gespeichert. Höchstens ${PD_MPMAX} Runden, die älteste fällt dann weg.`;
 const el=document.createElement('div'); el.id='pdSlots';
 el.innerHTML=`<div class="pdslh"><b>Spielstände</b><small>${sub}</small></div>${note?`<div class="pdslnote">${note}</div>`:''}<div class="pdslist">${html}</div><button class="pdopt pdslback" data-sv="back"><span class="pdoi">‹</span><span class="pdot"><b>Zurück</b></span></button>`;
 ov.appendChild(el);
 el.onclick=e=>{ const b=e.target.closest('[data-sv]'); if(!b) return; const k=b.dataset.sv, id=b.dataset.id;
  if(k==='back'){ el.remove(); if(from==='pause'||from==='mppause') pdPause(true); else if(from==='lobby') netLobbyRender(); return; }
  if(k==='solo'){ const r=pdLoadSave(); if(r){ el.remove(); pdLoadRun(r); pdSnd('go'); } return; }
  if(k==='solosave'){ pdSave(); pdSnd('ok'); pdSaveList(from,'✓ Gespeichert'); return; }
  if(k==='mpsave'){ const ok=netAutoSave(); pdSnd(ok?'ok':'bad'); pdSaveList(from,ok?'✓ Gespeichert':'Speichern nicht möglich (Speicher voll?)'); return; }
  if(k==='del'){ netRoundDel(id); pdSnd('tap'); pdSaveList(from,'Spielstand gelöscht'); return; }
  if(k==='load'){ const r=netRounds().find(q=>q.id===id); if(!r||PD.st!=='lobby') return; NET.load=r; el.remove(); pdSnd('ok'); netBroadcastLobby(); return; }
  if(k==='host'){ const r=netRounds().find(q=>q.id===id); if(!r) return; el.remove(); PD.wantLoad=r; netHost(); pdSnd('ok'); return; }
 };
}

function pdTorsoPath(x,B){ x.beginPath(); x.moveTo(-9.6,-9.5+B); x.quadraticCurveTo(-10.4,-13.5+B,-6,-14.2+B); x.lineTo(6,-14.2+B); x.quadraticCurveTo(10.4,-13.5+B,9.6,-9.5+B); x.lineTo(9,5.4+B); x.quadraticCurveTo(0,7.4+B,-9,5.4+B); x.closePath(); }
function pdSkPat(x,K,B,T){
 const p=K.pat, c=K.pc||'#fff'; if(!p) return;
 x.save(); pdTorsoPath(x,B); x.clip();
 const R=pdERng(7);
 if(p==='hstripes'){ x.fillStyle=c; for(let y=-14;y<8;y+=4) x.fillRect(-11,y+B,22,2); }
 else if(p==='dots'){ x.fillStyle=c; for(let i=0;i<14;i++){ x.beginPath(); x.arc(-9+R()*18,-13+R()*19+B,1.3,0,7); x.fill(); } }
 else if(p==='stars'){ x.fillStyle=c; for(let i=0;i<9;i++){ const sx=-9+R()*18, sy=-13+R()*18+B; x.fillRect(sx-.3,sy-1.2,.6,2.4); x.fillRect(sx-1.2,sy-.3,2.4,.6); } }
 else if(p==='camo'){ for(let i=0;i<12;i++){ x.fillStyle=i%2?c:pdShade(K.c[0],1.25); x.beginPath(); x.ellipse(-9+R()*18,-13+R()*19+B,2+R()*2.4,1.2+R()*1.4,R()*3,0,7); x.fill(); } }
 else if(p==='check'){ x.fillStyle=c; x.globalAlpha=.55; for(let y=-14;y<8;y+=5) x.fillRect(-11,y+B,22,2.2); for(let xx=-10;xx<11;xx+=5) x.fillRect(xx,-15+B,2.2,22); x.globalAlpha=1; }
 else if(p==='zebra'){ x.fillStyle=c; for(let i=-14;i<8;i+=3.6){ x.beginPath(); x.moveTo(-11,i+B); x.quadraticCurveTo(0,i+2+B,11,i-1+B); x.lineTo(11,i+.4+B); x.quadraticCurveTo(0,i+3.4+B,-11,i+1.4+B); x.fill(); } }
 else if(p==='hawaii'){ for(let i=0;i<7;i++){ const fx=-8+R()*16, fy=-12+R()*16+B; x.fillStyle=i%2?c:'#ff5ad1'; for(let k=0;k<5;k++){ x.beginPath(); x.arc(fx+Math.cos(k*1.26)*1.3,fy+Math.sin(k*1.26)*1.3,.9,0,7); x.fill(); } x.fillStyle='#fff'; x.beginPath(); x.arc(fx,fy,.6,0,7); x.fill(); } }
 else if(p==='pin'){ x.strokeStyle=c; x.lineWidth=.35; for(let xx=-10;xx<11;xx+=2.2){ x.beginPath(); x.moveTo(xx,-15+B); x.lineTo(xx,8+B); x.stroke(); } }
 else if(p==='splash'){ for(let i=0;i<9;i++){ x.fillStyle=['#3d8bff','#ff5a5a','#ffe14d','#3fd66b'][i%4]; x.beginPath(); x.arc(-9+R()*18,-13+R()*19+B,.8+R()*1.4,0,7); x.fill(); } }
 else if(p==='bones'){ x.strokeStyle=c; x.lineWidth=1.3; x.lineCap='round'; x.beginPath(); x.moveTo(0,-12+B); x.lineTo(0,4+B); for(let i=0;i<4;i++){ x.moveTo(-6,-9+i*3.4+B); x.quadraticCurveTo(0,-7+i*3.4+B,6,-9+i*3.4+B); } x.stroke(); x.lineCap='butt'; }
 else if(p==='wrap'){ x.strokeStyle=c; x.lineWidth=.8; for(let i=-16;i<10;i+=2.6){ x.beginPath(); x.moveTo(-11,i+B); x.lineTo(11,i+2.4+B); x.stroke(); } }
 else if(p==='riss'){ x.fillStyle=c; for(let i=0;i<5;i++){ const sx=-8+R()*16, sy=-12+R()*15+B; x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx+2,sy+1); x.lineTo(sx+.5,sy+3.5); x.lineTo(sx-1.2,sy+1.5); x.closePath(); x.fill(); } }
 else if(p==='weste'){ x.fillStyle=c; x.beginPath(); x.moveTo(-3,-14+B); x.lineTo(3,-14+B); x.lineTo(0,-3+B); x.closePath(); x.fill(); x.fillStyle='#d9d9d9'; for(let i=0;i<3;i++) x.fillRect(-.4,-1+i*2.4+B,.8,.8); }

 else if(p==='galaxy'){ const gr=x.createRadialGradient(-2,-5+B,1,0,-4+B,14); gr.addColorStop(0,'#7a3dff'); gr.addColorStop(.5,'#2b1a6a'); gr.addColorStop(1,'#0b0820'); x.fillStyle=gr; x.fillRect(-11,-15+B,22,23); for(let i=0;i<14;i++){ const tw=(Math.sin(T*3+i*2.1)+1)/2; x.fillStyle=`rgba(255,255,255,${.3+tw*.7})`; x.fillRect(-9+R()*18,-13+R()*19+B,.8,.8); } }
 else if(p==='lava'){ x.strokeStyle=c; x.lineWidth=1.1; x.shadowColor=c; x.shadowBlur=4; const pu=.6+.4*Math.sin(T*3); x.globalAlpha=pu; x.beginPath(); x.moveTo(-8,-12+B); x.lineTo(-3,-7+B); x.lineTo(-5,-1+B); x.lineTo(1,3+B); x.moveTo(7,-11+B); x.lineTo(3,-5+B); x.lineTo(6,1+B); x.stroke(); x.shadowBlur=0; x.globalAlpha=1; }

 else if(p==='rave'){ const h=(T*80)%360; const gr=x.createLinearGradient(-10,-14+B,10,6+B); gr.addColorStop(0,`hsl(${h},100%,60%)`); gr.addColorStop(1,`hsl(${(h+140)%360},100%,55%)`); x.fillStyle=gr; x.fillRect(-11,-15+B,22,23); }
 x.restore();
}
function pdSkLogo(x,K,B,BK){

 else if(L==='skull'){ x.fillStyle='#f2f2f2'; x.beginPath(); x.arc(4.8,-10.6+B,1.9,0,7); x.fill(); x.fillRect(3.8,-9.4+B,2,1.4); x.fillStyle='#111'; x.fillRect(4,-11+B,.7,.7); x.fillRect(5,-11+B,.7,.7); }
 else if(L==='heart'){ x.fillStyle='#ff3d6b'; x.beginPath(); x.moveTo(4.8,-8.4+B); x.bezierCurveTo(2.2,-10.4+B,3.4,-12.8+B,4.8,-11.2+B); x.bezierCurveTo(6.2,-12.8+B,7.4,-10.4+B,4.8,-8.4+B); x.fill(); }
 else if(L==='blitz'){ x.fillStyle='#ffe14d'; x.beginPath(); x.moveTo(5.4,-13+B); x.lineTo(3.4,-9.8+B); x.lineTo(4.8,-9.8+B); x.lineTo(4,-7.6+B); x.lineTo(6.4,-10.8+B); x.lineTo(5,-10.8+B); x.closePath(); x.fill(); }
 x.restore(); return true;
}
